# Копируется сборщиком (build.py) в репозиторий сайта как .github/workflows/counter-stats.yml.
# Сводка собственного счётчика посещаемости (без персональных данных) за последние 7 дней.
# Запуск вручную (workflow_dispatch) и по понедельникам. Ключ — секреты YC_KEY_ID / YC_SECRET
# (у сервисного аккаунта есть роль ydb.editor), адрес базы — переменная COUNTER_ENDPOINT или значение по умолчанию.
name: Counter stats

on:
  workflow_dispatch:
    inputs:
      test_hit:
        description: "Отправить тестовый заход /counter-test перед сводкой"
        type: boolean
        default: false
  schedule:
    - cron: "15 4 * * 1"

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      YDB_DOCAPI_ENDPOINT: ${{ vars.COUNTER_ENDPOINT || 'https://docapi.serverless.yandexcloud.net/ru-central1/b1ghmbg73m0hsfffhs49/etn3pm5hudp4d1vhugt8' }}
      FUNC: https://functions.yandexcloud.net/d4et3se79huv0a38k1cl
    steps:
      - name: Тестовый заход
        if: ${{ inputs.test_hit }}
        run: |
          curl -sS -D - -o /dev/null -X POST -H "Content-Type: text/plain" \
            -d '{"p":"/counter-test","r":"","d":"d","v":1}' "$FUNC" | grep -iE "^HTTP|^x-err" || true
          sleep 3
      - name: Сводка за 30 дней
        run: |
          pip install -q boto3
          python3 - <<'PY'
          import collections, datetime, json, os, boto3
          t = boto3.resource("dynamodb", endpoint_url=os.environ["YDB_DOCAPI_ENDPOINT"], region_name="ru-central1").Table("hits")
          items, kw = [], {}
          while True:
              r = t.scan(**kw); items += r["Items"]
              if "LastEvaluatedKey" not in r: break
              kw["ExclusiveStartKey"] = r["LastEvaluatedKey"]
          msk = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3)))
          start = (msk - datetime.timedelta(days=29)).strftime("%Y-%m-%d")
          test = collections.Counter()
          for it in items:  # тестовые заходы проверки счётчика вычитаем из итогов
              day, kind, *rest = it["k"].split("|")
              if kind == "p" and rest[0] == "/counter-test":
                  test[day] = (int(it.get("views", 0)), int(it.get("visits", 0)))
          days = collections.defaultdict(lambda: {"views": 0, "visits": 0, "pages": {}, "src": {}, "dev": {}})
          for it in items:
              day, kind, *rest = it["k"].split("|")
              if not day[:4].isdigit() or day < start: continue
              v, n = int(it.get("views", 0)), int(it.get("visits", 0))
              d = days[day]
              if kind == "all":
                  tv, tn = test.get(day, (0, 0)); d["views"] += v - tv; d["visits"] += n - tn
              elif kind == "p" and rest[0] != "/counter-test": d["pages"][rest[0]] = v
              elif kind == "r": d["src"][rest[0]] = n - (test.get(day, (0, 0))[1] if rest[0] == "direct" else 0)
              elif kind == "d": d["dev"][rest[0]] = n - (test.get(day, (0, 0))[1] if rest[0] == "d" else 0)
          out = {k: days[k] for k in sorted(days)}
          for d in out.values():
              d["src"] = {k: v for k, v in d["src"].items() if v > 0}; d["dev"] = {k: v for k, v in d["dev"].items() if v > 0}
          for k, d in out.items(): print(f"{k}: просмотры {d['views']}, визиты {d['visits']}")
          print("STATS_JSON " + json.dumps({"generated": msk.strftime("%Y-%m-%d %H:%M"), "days": out}, ensure_ascii=False))
          PY
